<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="game.css">
<style>
  /* the game's look comes from game.css (body.mb); this is the page's own layout: the track
     lists, and the player in a bar at the bottom (its height sets the page's bottom padding, music.js) */
  body.mb { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  body.mb section .help { margin: 0 0 10px; }

  /* the tracks: one button each, in as many columns as fit */
  ol.tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 7px 10px;
    margin: 0; padding: 0; list-style: none; }
  body.mb .trk { display: flex; align-items: center; gap: 9px; width: 100%; margin: 0; padding: 5px 11px 6px;
    text-align: left; color: var(--mb-ink); background: linear-gradient(#0d0204, #000); border-width: 1.5px; }
  body.mb .trk[aria-current="true"] { color: #fff; text-shadow: 0 0 7px var(--mb-glow), 0 0 2px #000;
    background: linear-gradient(90deg, rgb(170 14 36 / .8), rgb(12 2 4 / .95) 80%); }
  .trk .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trk .len { font: .82rem/1 var(--mb-mono); font-style: normal; color: var(--mb-dim); font-variant-numeric: tabular-nums; }
  .trk[aria-current="true"] .len { color: #f3dfe2; }
  /* the playing track's three bars */
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; flex: none; width: 13px; height: 12px; }
  .eq i { width: 3px; height: 35%; background: currentColor; opacity: .22; border-radius: 1px; }
  .trk[aria-current="true"] .eq i { opacity: 1; }
  body.playing .trk[aria-current="true"] .eq i { animation: eq .8s ease-in-out infinite alternate; }
  body.playing .trk[aria-current="true"] .eq i:nth-child(2) { animation-delay: -.55s; }
  body.playing .trk[aria-current="true"] .eq i:nth-child(3) { animation-delay: -.25s; }
  @keyframes eq { from { height: 20%; } to { height: 100%; } }
  @media (prefers-reduced-motion: reduce) {
    body.playing .trk[aria-current="true"] .eq i { animation: none; height: 80%; }
  }

  /* the player */
  .player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid;
    grid-template-columns: minmax(0, 1.1fr) auto minmax(0, 2fr) auto; align-items: center; gap: 8px 18px;
    padding: 10px max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: linear-gradient(rgb(26 3 7 / .92), rgb(14 2 4 / .98)); border-top: 2px solid var(--mb-edge);
    box-shadow: 0 -1px 0 #000, 0 -8px 24px rgb(0 0 0 / .5); }
  .now { min-width: 0; line-height: 1.25; }
  .now-title { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font: italic 600 1.08rem/1.3 var(--mb-serif); color: #fff; text-shadow: 0 0 7px var(--mb-glow), 0 1px 0 #000; }
  .now-from { display: block; font-size: .86rem; font-style: italic; color: var(--mb-dim); white-space: nowrap; }
  .transport { display: flex; align-items: center; gap: 6px; }
  body.mb .transport button { display: grid; place-items: center; width: 42px; height: 36px; margin: 0; padding: 0; }
  body.mb .transport #toggle { width: 52px; height: 40px; }
  .transport svg { width: 16px; height: 16px; fill: currentColor; filter: drop-shadow(0 1px 0 #000); }
  .transport #toggle svg { width: 18px; height: 18px; }
  #toggle .i-pause, body.playing #toggle .i-play { display: none; }
  body.playing #toggle .i-pause { display: block; }
  .seek { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .seek input { flex: 1; min-width: 0; }
  .seek span { min-width: 3.4em; font: .84rem/1 var(--mb-mono); color: var(--mb-dim); text-align: center; font-variant-numeric: tabular-nums; }
  .extras { display: flex; align-items: center; gap: 14px; }
  body.mb .extras button { margin: 0; min-width: 8.6em; padding: 4px 10px 5px; font-size: .92rem; }
  .vol { display: flex; align-items: center; gap: 7px; font-size: .9rem; font-style: italic; color: var(--mb-dim); }
  .vol input { width: 96px; }
  @media (max-width: 820px) {
    .player { grid-template-columns: minmax(0, 1fr) auto; }
    .seek, .extras { grid-column: 1 / -1; }
    .extras { justify-content: space-between; }
    .vol input { width: min(150px, 34vw); }
  }
</style>
<script type="module" src="music.js"></script>
</head>
<body class="mb">
<header>
  <div class="mb-headrow">
    <h1>Music</h1>
    <span><a id="back" href="./play.html">Back to the game</a> <button id="close" type="button" class="secondary" hidden>Close</button></span>
  </div>
  <p class="lede">The game's background music, played from its own files. The game numbers its tracks but doesn't
  name them.<span id="paused-note" hidden> The game is paused until you close this page.</span></p>
</header>
<main>
  <p id="message" class="banner error" role="alert" hidden></p>
  <div id="groups"><p class="muted">Reading the track list…</p></div>
</main>
<div class="player" id="player" role="region" aria-label="Player">
  <div class="now">
    <span class="now-title" id="now-title">No track chosen</span>
    <span class="now-from" id="now-from">Choose one from the list</span>
  </div>
  <div class="transport">
    <button id="prev" type="button" aria-label="Previous track" title="Previous track">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2h2.2v12H2.5zM14 2.3v11.4L5.6 8z"/></svg>
    </button>
    <button id="toggle" type="button" aria-label="Play" title="Play (Space)">
      <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.8 14 8 3.5 14.2z"/></svg>
      <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h3.6v12H3zM9.4 2H13v12H9.4z"/></svg>
    </button>
    <button id="next" type="button" aria-label="Next track" title="Next track">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.3 2h2.2v12h-2.2zM2 2.3v11.4L10.4 8z"/></svg>
    </button>
  </div>
  <div class="seek">
    <span id="pos">0:00</span>
    <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Position in the track" disabled>
    <span id="dur">0:00</span>
  </div>
  <div class="extras">
    <button id="repeat" type="button" class="secondary">Repeat: all</button>
    <label class="vol">Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="1"></label>
  </div>
</div>
<audio id="audio" preload="auto"></audio>
</body>
</html>
